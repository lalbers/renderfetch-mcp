# Run renderfetch-mcp with Podman or Docker:
#   cp .env.example .env        # then edit the secrets
#   podman compose up -d --build      (or: docker compose up -d --build)
services:
  renderfetch-mcp:
    build:
      context: .
      dockerfile: Containerfile
    # 'localhost/' is the Podman convention for a locally-built image; it also
    # works under Docker locally (just don't try to `docker push` this tag).
    image: localhost/renderfetch-mcp:latest
    container_name: renderfetch-mcp
    env_file: .env
    # Publish to loopback only; your reverse proxy (on the host) fronts it with TLS.
    ports:
      - "127.0.0.1:10120:8080"
    volumes:
      - renderfetch-data:/data
    shm_size: "2g"
    init: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  renderfetch-data:
