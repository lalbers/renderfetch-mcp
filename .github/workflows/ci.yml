name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Install the matching Chromium explicitly after dependency auditing.
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
      - name: Containerfile uses the Playwright image matching package.json
        run: |
          v=$(node -p "require('./package.json').dependencies.playwright")
          test "$(grep -c "^FROM mcr.microsoft.com/playwright:v$v-noble " Containerfile)" -eq 2 \
            || { echo "::error file=Containerfile::base image must be playwright:v$v-noble (both stages)"; exit 1; }
      - run: npm ci
      - run: npm run build
      - run: npm audit --audit-level=high
      - run: npx playwright install --with-deps chromium
      - run: npm test
        env:
          RUN_E2E: "1"
